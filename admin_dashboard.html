<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แดชบอร์ดตรวจสอบข้อมูล (เจ้าหน้าที่)</title>
    <style>
        :root {
            --bg-color: #f0f4f9;
            --card-bg: #ffffff;
            --primary-navy: #1a237e;
            --primary-blue: #283593;
            --accent-red: #d32f2f;
            --sheet-green: #2e7d32;
            --text-main: #1c2541;
            --text-sub: #5c677d;
            --border-color: #d0d7de;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(26, 35, 126, 0.1);
            border: 1px solid var(--border-color);
        }
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        h2 { margin: 0; color: var(--primary-navy); font-size: 20px; }
        
        .tab-buttons {
            display: flex;
            gap: 10px;
        }
        .tab-btn {
            padding: 8px 16px;
            border: 1.5px solid var(--border-color);
            background-color: #f8fafc;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            color: var(--text-sub);
            transition: all 0.2s;
        }
        .tab-btn.active {
            background-color: var(--primary-blue);
            color: white;
            border-color: var(--primary-blue);
        }

        .btn-action {
            background-color: var(--primary-blue);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-action:hover { background-color: var(--primary-navy); }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13.5px;
        }
        th, td {
            padding: 12px 10px;
            border-bottom: 1px solid #eef2f6;
        }
        th {
            background-color: #f8fafc;
            color: var(--primary-navy);
            font-weight: 700;
        }
        tr:hover { background-color: #fcfdfe; }
        .badge {
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
        }
        .badge-danger { background: #ffebee; color: #c2185b; }
        .badge-success { background: #e8f5e9; color: #2e7d32; }
        
        .loading-row {
            text-align: center;
            color: var(--text-sub);
            padding: 30px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 13px;
        }
        .back-link:hover { color: var(--primary-blue); text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-link">&larr; กลับสู่หน้าหลัก อสม.</a>
    
    <div class="header-flex">
        <div>
            <h2>📊 ระบบหลังบ้าน - ตรวจสอบข้อมูลสุขภาพและคนไข้</h2>
            <p style="margin: 4px 0 0 0; font-size: 12.5px; color: var(--text-sub);">แสดงรายการข้อมูลที่บันทึกเข้าสู่ระบบทั้งหมดแบบเรียลไทม์</p>
        </div>
        
        <div class="tab-buttons">
            <button class="tab-btn active" id="btnTabBlood" onclick="switchTab('blood')">🩺 ข้อมูลความดัน</button>
            <button class="tab-btn" id="btnTabHealth" onclick="switchTab('health')">📝 ข้อมูลสุขภาพ (Health)</button>
        </div>

        <button class="btn-action" onclick="fetchData()">🔄 โหลดข้อมูลใหม่</button>
    </div>

    <div class="table-responsive">
        <table>
            <thead id="tableHeader">
                <!-- หัวตารางจะเปลี่ยนตาม Tab ที่เลือก -->
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="7" class="loading-row">กำลังโหลดข้อมูล...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
// ⚠️ สำคัญ: นำ Web App URL ของ Google Apps Script มาใส่ตรงนี้
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwftwXrrSbxrGPA076KWYscPFRai7Mjo7LZ0rrpi0k-bqzf5s0--fY7KuI92f1rLHS1/exec"; 

let currentTab = 'blood'; // ค่าเริ่มต้นแสดงตารางความดัน

function switchTab(tabName) {
    currentTab = tabName;
    document.getElementById('btnTabBlood').classList.toggle('active', tabName === 'blood');
    document.getElementById('btnTabHealth').classList.toggle('active', tabName === 'health');
    fetchData();
}

function fetchData() {
    const tbody = document.getElementById('tableBody');
    const thead = document.getElementById('tableHeader');
    tbody.innerHTML = `<tr><td colspan="7" class="loading-row">กำลังดึงข้อมูลจาก Google Sheet...</td></tr>`;

    // กำหนดหัวตารางตาม Tab
    if (currentTab === 'blood') {
        thead.innerHTML = `
            <tr>
                <th>#</th>
                <th>วันเวลาที่ตรวจ</th>
                <th>เลขบัตรประชาชน</th>
                <th>ชื่อผู้รับการตรวจ</th>
                <th>ความดัน (SYS/DIA)</th>
                <th>ผลการประเมิน</th>
                <th>เปรียบเทียบครั้งก่อน</th>
            </tr>
        `;
    } else {
        thead.innerHTML = `
            <tr>
                <th>#</th>
                <th>เลขบัตรประชาชน</th>
                <th>ชื่อ-นามสกุล</th>
                <th>ข้อมูลสุขภาพ / รายละเอียด</th>
            </tr>
        `;
    }

    // เรียกข้อมูลผ่าน Apps Script (Action: get_data ตามแท็บ)
    fetch(`${WEB_APP_URL}?action=get_data&sheet=${currentTab}`)
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                renderTable(data.rows);
            } else {
                tbody.innerHTML = `<tr><td colspan="7" class="loading-row" style="color:red;">❌ เกิดข้อผิดพลาด: ${data.message}</td></tr>`;
            }
        })
        .catch(error => {
            console.error('Error:', error);
            tbody.innerHTML = `<tr><td colspan="7" class="loading-row" style="color:red;">❌ ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้</td></tr>`;
        });
}

function renderTable(rows) {
    const tbody = document.getElementById('tableBody');
    if (!rows || rows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="loading-row">ไม่พบข้อมูลในระบบ</td></tr>`;
        return;
    }

    tbody.innerHTML = rows.map((row, index) => {
        if (currentTab === 'blood') {
            return `
                <tr>
                    <td>#${index + 1}</td>
                    <td>${row[0] || '-'}</td>
                    <td>${row[1] || '-'}</td>
                    <td><strong>${row[2] || '-'}</strong></td>
                    <td><span style="background:#e8f4fd; padding:3px 8px; border-radius:6px; font-weight:bold;">${row[3] || '-'} / ${row[4] || '-'}</span> mmHg</td>
                    <td><span class="badge ${row[5] && row[5].includes('สูง') ? 'badge-danger' : 'badge-success'}">${row[5] || '-'}</span></td>
                    <td style="color:var(--text-sub); font-size:12px;">${row[6] || '-'}</td>
                </tr>
            `;
        } else {
            // สำหรับตารางสุขภาพ (Health) - ปรับตามคอลัมน์จริงใน Google Sheet ของคุณ
            return `
                <tr>
                    <td>#${index + 1}</td>
                    <td>${row[0] || '-'}</td>
                    <td><strong>${row[1] || '-'}</strong></td>
                    <td>${row.slice(2).join(' | ')}</td>
                </tr>
            `;
        }
    }).join('');
}

// โหลดข้อมูลอัตโนมัติเมื่อเปิดหน้าเว็บ
window.onload = function() {
    fetchData();
};
</script>

</body>
</html>
