<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แดชบอร์ดตรวจสอบข้อมูล (เจ้าหน้าที่)</title>
    <style>
        :root {
            --bg-color: #f0f4f9;
            --card-bg: #ffffff;
            --primary-navy: #1a237e;
            --primary-blue: #283593;
            --accent-red: #d32f2f;
            --sheet-green: #2e7d32;
            --text-main: #1c2541;
            --text-sub: #5c677d;
            --border-color: #d0d7de;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(26, 35, 126, 0.1);
            border: 1px solid var(--border-color);
        }
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        h2 { margin: 0; color: var(--primary-navy); font-size: 20px; }
        
        .tab-buttons {
            display: flex;
            gap: 10px;
        }
        .tab-btn {
            padding: 8px 16px;
            border: 1.5px solid var(--border-color);
            background-color: #f8fafc;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            color: var(--text-sub);
            transition: all 0.2s;
        }
        .tab-btn.active {
            background-color: var(--primary-blue);
            color: white;
            border-color: var(--primary-blue);
        }

        .btn-action {
            background-color: var(--primary-blue);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-action:hover { background-color: var(--primary-navy); }

        .btn-edit {
            background-color: #ff9800;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-edit:hover { background-color: #f57c00; }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 12.5px;
            white-space: nowrap;
        }
        th, td {
            padding: 10px 8px;
            border-bottom: 1px solid #eef2f6;
        }
        th {
            background-color: #f8fafc;
            color: var(--primary-navy);
            font-weight: 700;
        }
        tr:hover { background-color: #fcfdfe; }
        .badge {
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
        }
        .badge-danger { background: #ffebee; color: #c2185b; }
        .badge-success { background: #e8f5e9; color: #2e7d32; }
        
        .loading-row {
            text-align: center;
            color: var(--text-sub);
            padding: 30px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 13px;
        }
        .back-link:hover { color: var(--primary-blue); text-decoration: underline; }

        /* Modal Popup สำหรับแก้ไขข้อมูล */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 15px;
            width: 550px;
            max-width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .modal-content h3 { margin-top: 0; color: var(--primary-navy); border-bottom: 2px solid #eef2f6; padding-bottom: 10px; }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .form-group { margin-bottom: 10px; }
        .form-group.full { grid-column: span 2; }
        .form-group label { display: block; font-size: 11.5px; font-weight: bold; margin-bottom: 4px; color: var(--text-sub); }
        .form-group input, .form-group select {
            width: 100%; padding: 8px 10px; border: 1px solid var(--border-color); border-radius: 8px; box-sizing: border-box; font-size: 13px;
        }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; grid-column: span 2; }
        .btn-cancel { background-color: #e0e0e0; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-save { background-color: var(--sheet-green); color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-link">&larr; กลับสู่หน้าหลัก อสม.</a>
    
    <div class="header-flex">
        <div>
            <h2>📊 ระบบหลังบ้าน - ตรวจสอบข้อมูลสุขภาพและคนไข้</h2>
            <p style="margin: 4px 0 0 0; font-size: 12.5px; color: var(--text-sub);">แสดงรายการข้อมูลที่บันทึกเข้าสู่ระบบทั้งหมดแบบเรียลไทม์</p>
        </div>
        
        <div class="tab-buttons">
            <button class="tab-btn active" id="btnTabBlood" onclick="switchTab('blood')">🩺 ข้อมูลความดัน</button>
            <button class="tab-btn" id="btnTabHealth" onclick="switchTab('health')">📝 ข้อมูลสุขภาพ (Health)</button>
        </div>

        <button class="btn-action" onclick="fetchData()">🔄 โหลดข้อมูลใหม่</button>
    </div>

    <div class="table-responsive">
        <table>
            <thead id="tableHeader"></thead>
            <tbody id="tableBody">
                <tr><td colspan="16" class="loading-row">กำลังโหลดข้อมูล...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal สำหรับแก้ไขข้อมูล -->
<div class="modal" id="editModal">
    <div class="modal-content">
        <h3>✏️ แก้ไขข้อมูลสุขภาพ</h3>
        <input type="hidden" id="editRowIndex">
        <div class="form-grid">
            <div class="form-group full">
                <label>เลขบัตรประชาชน</label>
                <input type="text" id="editIdCard" readonly style="background-color: #f5f5f5;">
            </div>
            <div class="form-group">
                <label>คำนำหน้า</label>
                <input type="text" id="editPrefix">
            </div>
            <div class="form-group">
                <label>ชื่อ</label>
                <input type="text" id="editName">
            </div>
            <div class="form-group full">
                <label>นามสกุล</label>
                <input type="text" id="editLastname">
            </div>
            <div class="form-group">
                <label>เพศ</label>
                <input type="text" id="editGender">
            </div>
            <div class="form-group">
                <label>อายุ</label>
                <input type="number" id="editAge">
            </div>
            <div class="form-group">
                <label>อาชีพ</label>
                <input type="text" id="editJob">
            </div>
            <div class="form-group">
                <label>สถานะ</label>
                <input type="text" id="editStatus">
            </div>
            <div class="form-group">
                <label>บ้านเลขที่</label>
                <input type="text" id="editAddress">
            </div>
            <div class="form-group">
                <label>ตำบล</label>
                <input type="text" id="editSubdistrict">
            </div>
            <div class="form-group">
                <label>อำเภอ</label>
                <input type="text" id="editDistrict">
            </div>
            <div class="form-group">
                <label>จังหวัด</label>
                <input type="text" id="editProvince">
            </div>
            <div class="form-group">
                <label>ส่วนสูง (ซม.)</label>
                <input type="number" id="editHeight">
            </div>
            <div class="form-group">
                <label>น้ำหนัก (กก.)</label>
                <input type="number" id="editWeight">
            </div>
            
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()" type="button">ยกเลิก</button>
                <button class="btn-save" onclick="saveEdit()" type="button">บันทึกการแก้ไข</button>
            </div>
        </div>
    </div>
</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwftwXrrSbxrGPA076KWYscPFRai7Mjo7LZ0rrpi0k-bqzf5s0--fY7KuI92f1rLHS1/exec"; 

let currentTab = 'blood'; 
let cachedRows = []; 

function switchTab(tabName) {
    currentTab = tabName;
    document.getElementById('btnTabBlood').classList.toggle('active', tabName === 'blood');
    document.getElementById('btnTabHealth').classList.toggle('active', tabName === 'health');
    fetchData();
}

function fetchData() {
    const tbody = document.getElementById('tableBody');
    const thead = document.getElementById('tableHeader');
    tbody.innerHTML = `<tr><td colspan="16" class="loading-row">กำลังดึงข้อมูลจาก Google Sheet...</td></tr>`;

    if (currentTab === 'blood') {
        thead.innerHTML = `
            <tr>
                <th>#</th>
                <th>วันเวลาที่ตรวจ</th>
                <th>เลขบัตรประชาชน</th>
                <th>ชื่อผู้รับการตรวจ</th>
                <th>ความดัน (SYS/DIA)</th>
                <th>ผลการประเมิน</th>
                <th>เปรียบเทียบครั้งก่อน</th>
            </tr>
        `;
    } else {
        // เรียงหัวตารางให้ตรงกับ Google Sheet เป๊ะๆ
        thead.innerHTML = `
            <tr>
                <th>จัดการ</th>
                <th>#</th>
                <th>เลขบัตรประชาชน</th>
                <th>คำนำหน้า</th>
                <th>ชื่อ</th>
                <th>นามสกุล</th>
                <th>เพศ</th>
                <th>อายุ</th>
                <th>อาชีพ</th>
                <th>สถานะ</th>
                <th>บ้านเลขที่</th>
                <th>ตำบล</th>
                <th>อำเภอ</th>
                <th>จังหวัด</th>
                <th>ส่วนสูง (ซม.)</th>
                <th>น้ำหนัก (กก.)</th>
            </tr>
        `;
    }

    fetch(`${WEB_APP_URL}?action=get_data&sheet=${currentTab}`)
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                cachedRows = data.rows; 
                renderTable(cachedRows);
            } else {
                tbody.innerHTML = `<tr><td colspan="16" class="loading-row" style="color:red;">❌ เกิดข้อผิดพลาด: ${data.message}</td></tr>`;
            }
        })
        .catch(error => {
            console.error('Error:', error);
            tbody.innerHTML = `<tr><td colspan="16" class="loading-row" style="color:red;">❌ ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้</td></tr>`;
        });
}

function renderTable(rows) {
    const tbody = document.getElementById('tableBody');
    if (!rows || rows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="16" class="loading-row">ไม่พบข้อมูลในระบบ</td></tr>`;
        return;
    }

    tbody.innerHTML = rows.map((row, index) => {
        if (currentTab === 'blood') {
            return `
                <tr>
                    <td>#${index + 1}</td>
                    <td>${row[0] || '-'}</td>
                    <td>${row[1] || '-'}</td>
                    <td><strong>${row[2] || '-'}</strong></td>
                    <td><span style="background:#e8f4fd; padding:3px 8px; border-radius:6px; font-weight:bold;">${row[3] || '-'} / ${row[4] || '-'}</span> mmHg</td>
                    <td><span class="badge ${row[5] && row[5].includes('สูง') ? 'badge-danger' : 'badge-success'}">${row[5] || '-'}</span></td>
                    <td style="color:var(--text-sub); font-size:12px;">${row[6] || '-'}</td>
                </tr>
            `;
        } else {
            // จับคู่อันดับ index ของอาเรย์ให้ตรงกับ Google Sheet (A ถึง N)
            return `
                <tr>
                    <td><button class="btn-edit" onclick="openEditModal(${index})">✏️ แก้ไข</button></td>
                    <td>#${index + 1}</td>
                    <td>${row[0] || '-'}</td> <!-- เลขบัตรประชาชน (Col A) -->
                    <td>${row[1] || '-'}</td> <!-- คำนำหน้า (Col B) -->
                    <td><strong>${row[2] || '-'}</strong></td> <!-- ชื่อ (Col C) -->
                    <td>${row[3] || '-'}</td> <!-- นามสกุล (Col D) -->
                    <td>${row[4] || '-'}</td> <!-- เพศ (Col E) -->
                    <td>${row[5] || '-'}</td> <!-- อายุ (Col F) -->
                    <td>${row[6] || '-'}</td> <!-- อาชีพ (Col G) -->
                    <td>${row[7] || '-'}</td> <!-- สถานะ (Col H) -->
                    <td>${row[8] || '-'}</td> <!-- บ้านเลขที่ (Col I) -->
                    <td>${row[9] || '-'}</td> <!-- ตำบล (Col J) -->
                    <td>${row[10] || '-'}</td> <!-- อำเภอ (Col K) -->
                    <td>${row[11] || '-'}</td> <!-- จังหวัด (Col L) -->
                    <td>${row[12] || '-'}</td> <!-- ส่วนสูง (Col M) -->
                    <td>${row[13] || '-'}</td> <!-- น้ำหนัก (Col N) -->
                </tr>
            `;
        }
    }).join('');
}

// เปิด Popup และแมตช์ข้อมูลให้ตรงกับ Google Sheet
function openEditModal(index) {
    const row = cachedRows[index];
    document.getElementById('editRowIndex').value = index + 2; 
    document.getElementById('editIdCard').value = row[0] || '';
    document.getElementById('editPrefix').value = row[1] || '';
    document.getElementById('editName').value = row[2] || '';
    document.getElementById('editLastname').value = row[3] || '';
    document.getElementById('editGender').value = row[4] || '';
    document.getElementById('editAge').value = row[5] || '';
    document.getElementById('editJob').value = row[6] || '';
    document.getElementById('editStatus').value = row[7] || '';
    document.getElementById('editAddress').value = row[8] || '';
    document.getElementById('editSubdistrict').value = row[9] || '';
    document.getElementById('editDistrict').value = row[10] || '';
    document.getElementById('editProvince').value = row[11] || '';
    document.getElementById('editHeight').value = row[12] || '';
    document.getElementById('editWeight').value = row[13] || '';
    
    document.getElementById('editModal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('editModal').style.display = 'none';
}

function saveEdit() {
    const rowIndex = document.getElementById('editRowIndex').value;
    
    const payload = {
        row: rowIndex,
        prefix: document.getElementById('editPrefix').value,
        name: document.getElementById('editName').value,
        lastname: document.getElementById('editLastname').value,
        gender: document.getElementById('editGender').value,
        age: document.getElementById('editAge').value,
        job: document.getElementById('editJob').value,
        status: document.getElementById('editStatus').value,
        address: document.getElementById('editAddress').value,
        subdistrict: document.getElementById('editSubdistrict').value,
        district: document.getElementById('editDistrict').value,
        province: document.getElementById('editProvince').value,
        height: document.getElementById('editHeight').value,
        weight: document.getElementById('editWeight').value
    };

    const btnSave = document.querySelector('.btn-save');
    btnSave.innerText = 'กำลังบันทึก...';
    btnSave.disabled = true;

    const params = new URLSearchParams({
        action: 'update_all',
        ...payload
    });

    fetch(`${WEB_APP_URL}?${params.toString()}`)
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                alert('✅ บันทึกการแก้ไขสำเร็จ!');
                closeModal();
                fetchData(); 
            } else {
                alert('❌ เกิดข้อผิดพลาด: ' + data.message);
            }
            btnSave.innerText = 'บันทึกการแก้ไข';
            btnSave.disabled = false;
        })
        .catch(error => {
            console.error('Error:', error);
            alert('❌ ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้');
            btnSave.innerText = 'บันทึกการแก้ไข';
            btnSave.disabled = false;
        });
}

window.onload = function() {
    fetchData();
};
</script>

</body>
</html>
