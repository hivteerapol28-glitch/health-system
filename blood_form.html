<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกความดันโลหิต</title>
    <style>
        :root {
            --bg-color: #f7f4fc;
            --card-bg: #ffffff;
            --primary-pastel: #b39ddb;
            --primary-dark: #7e57c2;
            --text-main: #4a3b60;
            --text-sub: #8c7b9e;
            --border-color: #e1d7f2;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#e8e0f5 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(126, 87, 194, 0.08);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 440px;
            text-align: center;
        }
        .icon-banner { font-size: 50px; margin-bottom: 10px; }
        h2 { margin: 0 0 10px 0; color: var(--text-main); font-size: 24px; }
        p.subtitle { margin: 0 0 25px 0; color: var(--text-sub); font-size: 14px; }
        .input-group { margin-bottom: 18px; text-align: left; }
        label { display: block; margin-bottom: 6px; color: var(--text-main); font-weight: 600; font-size: 14px; }
        input { width: 100%; padding: 12px 15px; border: 1.5px solid var(--border-color); border-radius: 10px; box-sizing: border-box; font-size: 15px; background-color: #faf9fe; color: var(--text-main); font-family: inherit; }
        input:focus { outline: none; border-color: var(--primary-pastel); background-color: #ffffff; }
        
        .form-row { display: flex; gap: 12px; }
        .form-row .input-group { flex: 1; }

        button { width: 100%; padding: 14px; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.3s ease; margin-top: 10px; }
        .btn-blue { background-color: #007bff; box-shadow: 0 4px 12px rgba(0, 123, 255, 0.2); }
        .btn-blue:hover { background-color: #0056b3; }
        .btn-outline { background-color: transparent; color: var(--text-sub); border: 1px solid var(--border-color); margin-top: 15px; }
        .btn-outline:hover { background-color: #ede7f6; color: var(--primary-dark); }
        
        .result-box { display: none; background-color: #ede7f6; padding: 15px; border-radius: 12px; margin-top: 20px; text-align: left; border: 1px dashed var(--primary-pastel); }
    </style>
</head>
<body>

<div class="container">
    <div class="icon-banner">🩺</div>
    <h2>บันทึกความดันโลหิต</h2>
    <p class="subtitle">กรอกค่าความดันเพื่อประเมินผลเบื้องต้น</p>
    
    <!-- ฟิลด์ระบุชื่อผู้ตรวจ -->
    <div class="input-group">
        <label>ชื่อผู้รับการตรวจ / ผู้ป่วย</label>
        <input type="text" id="inspector" placeholder="ระบุชื่อ-นามสกุล">
    </div>

    <!-- ฟิลด์ระบุวันเวลาที่ตรวจ -->
    <div class="input-group">
        <label>วันที่และเวลาตรวจ</label>
        <input type="datetime-local" id="checkDateTime">
    </div>

    <div class="form-row">
        <div class="input-group">
            <label>ตัวบน (SYS) mmHg</label>
            <input type="number" id="sys" placeholder="เช่น 125">
        </div>
        <div class="input-group">
            <label>ตัวล่าง (DIA) mmHg</label>
            <input type="number" id="dia" placeholder="เช่น 70">
        </div>
    </div>
    
    <button class="btn-blue" onclick="checkBlood()">ประเมินผลและบันทึก</button>
    
    <div id="resultBox" class="result-box">
        <p style="color: var(--primary-dark); font-weight: bold; margin: 0 0 5px 0;">🩺 ผลประเมินล่าสุด:</p>
        <p id="resultText" style="margin: 0; color: var(--text-main); font-size: 15px; white-space: pre-line;"></p>
    </div>

    <button class="btn-outline" onclick="window.location.href='./index.html';">&larr; กลับหน้าหลักระบบ</button>
</div>

<script>
// ตั้งค่าวันเวลาปัจจุบันให้อัตโนมัติเมื่อเปิดหน้า
window.onload = function() {
    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    document.getElementById('checkDateTime').value = now.toISOString().slice(0, 16);
};

function saveToLocalStorage(inspector, sys, dia, status) {
    let bloodRecords = JSON.parse(localStorage.getItem('bloodRecords') || '[]');
    bloodRecords.push({
        inspector: inspector,
        sys: sys,
        dia: dia,
        status: status,
        date: new Date().toISOString()
    });
    localStorage.setItem('bloodRecords', JSON.stringify(bloodRecords));
}

function checkBlood() {
    const inspector = document.getElementById('inspector').value.trim();
    const checkDateTime = document.getElementById('checkDateTime').value;
    const sys = parseInt(document.getElementById('sys').value);
    const dia = parseInt(document.getElementById('dia').value);
    
    if(!inspector) {
        alert('กรุณากรอกชื่อผู้รับการตรวจด้วยครับ');
        return;
    }
    if(!checkDateTime) {
        alert('กรุณาระบุวันที่และเวลาในการตรวจครับ');
        return;
    }
    if(!sys || !dia) {
        alert('กรุณากรอกค่าความดันให้ครบถ้วนครับ');
        return;
    }

    let status = "";
    if (sys < 120 && dia < 80) status = "✅ ความดันปกติ ";
    else if (sys <= 129 && dia < 80) status = "⚠️ ความดันเริ่มสูงกว่าปกติเล็กน้อย";
    else if (sys <= 139 || dia <= 89) status = "❌ ความดันสูงระยะเริ่มต้น (Stage 1)";
    else status = "🚨 ความดันสูงรุนแรง (Stage 2) ควรพบแพทย์";

    // จัดรูปแบบวันที่ให้แสดงผลสวยงาม
    const formattedDate = new Date(checkDateTime).toLocaleString('th-TH', {
        year: 'numeric', month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit'
    });

    document.getElementById('resultText').innerText = `ผู้ตรวจ: ${inspector}\nเวลาที่ตรวจ: ${formattedDate} น.\nค่าความดัน: ${sys}/${dia} mmHg\nผลลัพธ์: ${status}`;
    document.getElementById('resultBox').style.display = 'block';

    // 🎯 บันทึกลง LocalStorage ของเครื่องทันที
    saveToLocalStorage(inspector, sys, dia, status);

    // ส่งค่าไปยัง Google Sheets
    const payload = {
        sheetName: "blood",
        values: [checkDateTime, inspector, sys, dia, status]
    };

    const webAppUrl = "https://script.google.com/macros/s/AKfycbzyu_sH__jrKWTS9qnU2DJIun36ufJS-RiXAmC3zaYx8hIm_OiXQnXFX8oBYioXHUlI/exec";

    fetch(webAppUrl, {
        method: "POST",
        body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
        if(data.result === "success") {
            alert(`บันทึกข้อมูลของ ${inspector} เรียบร้อยแล้ว!`);
        } else {
            alert('เกิดข้อผิดพลาดจาก Sheets: ' + data.error);
        }
    })
    .catch(err => {
        console.error("ส่งข้อมูลความดันล้มเหลว:", err);
        alert('บันทึกข้อมูลลงในเครื่องเรียบร้อยแล้ว!');
    });
}
</script>
</body>
</html>
