<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกแบบสำรวจข้อมูลสุขภาพ</title>
    <style>
        :root {
            --bg-color: #f7f4fc;
            --card-bg: #ffffff;
            --primary-pastel: #b39ddb;
            --primary-dark: #7e57c2;
            --text-main: #4a3b60;
            --text-sub: #8c7b9e;
            --border-color: #e1d7f2;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#e8e0f5 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(126, 87, 194, 0.08);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        .icon-banner { font-size: 50px; margin-bottom: 10px; }
        h2 { margin: 0 0 10px 0; color: var(--text-main); font-size: 24px; }
        p.subtitle { margin: 0 0 25px 0; color: var(--text-sub); font-size: 14px; }
        
        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-row .input-group {
            flex: 1;
            margin-bottom: 0;
        }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 6px; color: var(--text-main); font-weight: 600; font-size: 14px; }
        input, select { width: 100%; padding: 11px 15px; border: 1.5px solid var(--border-color); border-radius: 10px; box-sizing: border-box; font-size: 15px; background-color: #faf9fe; color: var(--text-main); }
        input:focus, select:focus { outline: none; border-color: var(--primary-pastel); background-color: #ffffff; }
        
        button { width: 100%; padding: 13px; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.3s ease; margin-top: 10px; }
        .btn-submit { background-color: #27ae60; box-shadow: 0 4px 12px rgba(39, 174, 96, 0.2); }
        .btn-submit:hover { background-color: #219150; }
        .btn-outline { background-color: transparent; color: var(--text-sub); border: 1px solid var(--border-color); margin-top: 12px; }
        .btn-outline:hover { background-color: #ede7f6; color: var(--primary-dark); }
        
        fieldset {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: left;
        }
        legend {
            color: var(--primary-dark);
            font-weight: bold;
            font-size: 14px;
            padding: 0 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon-banner">📝</div>
    <h2>แบบสำรวจข้อมูลสุขภาพ</h2>
    <p class="subtitle">กรอกประวัติส่วนตัวและข้อมูลสุขภาพชุมชน</p>

    <div class="form-row">
        <div class="input-group" style="flex: 0.4;">
            <label>คำนำหน้า</label>
            <select id="title">
                <option>นาย</option>
                <option>นาง</option>
                <option>นางสาว</option>
            </select>
        </div>
        <div class="input-group">
            <label>ชื่อ</label>
            <input type="text" id="firstname" placeholder="กรอกชื่อจริง">
        </div>
    </div>

    <div class="form-row">
        <div class="input-group">
            <label>นามสกุล</label>
            <input type="text" id="lastname" placeholder="กรอกนามสกุล">
        </div>
    </div>

    <div class="form-row">
        <div class="input-group">
            <label>เพศ</label>
            <select id="gender">
                <option>ชาย</option>
                <option>หญิง</option>
                <option>อื่น ๆ</option>
            </select>
        </div>
        <div class="input-group">
            <label>อายุ (ปี)</label>
            <input type="number" id="age" placeholder="เช่น 25">
        </div>
    </div>

    <div class="form-row">
        <div class="input-group">
            <label>อาชีพ</label>
            <input type="text" id="occupation" placeholder="เช่น รับจ้าง, ค้าขาย">
        </div>
        <div class="input-group">
            <label>สถานะ</label>
            <select id="status">
                <option>โสด</option>
                <option>สมรส</option>
                <option>หม้าย / หย่าร้าง</option>
            </select>
        </div>
    </div>

    <fieldset>
        <legend>ข้อมูลที่อยู่ปัจจุบัน</legend>
        <div class="form-row" style="margin-bottom: 10px;">
            <div class="input-group">
                <label>บ้านเลขที่</label>
                <input type="text" id="address_no" placeholder="เช่น 12/3 ม.4">
            </div>
            <div class="input-group">
                <label>ตำบล</label>
                <input type="text" id="subdistrict" placeholder="กรอกตำบล">
            </div>
        </div>
        <div class="form-row">
            <div class="input-group">
                <label>อำเภอ</label>
                <input type="text" id="district" placeholder="กรอกอำเภอ">
            </div>
            <div class="input-group">
                <label>จังหวัด</label>
                <input type="text" id="province" placeholder="กรอกจังหวัด">
            </div>
        </div>
    </fieldset>

    <div class="form-row">
        <div class="input-group">
            <label>ส่วนสูง (ซม.)</label>
            <input type="number" id="height" placeholder="เช่น 170">
        </div>
        <div class="input-group">
            <label>น้ำหนัก (กก.)</label>
            <input type="number" id="weight" placeholder="เช่น 65">
        </div>
    </div>

    <button class="btn-submit" onclick="saveData()">บันทึกข้อมูลสุขภาพ</button>
    <button class="btn-outline" onclick="window.location.href='heal.html';">&larr; กลับหน้าหลักระบบ</button>
</div>

<script>
function saveData() {
    const title = document.getElementById('title').value;
    const name = document.getElementById('firstname').value;
    const lastname = document.getElementById('lastname').value;
    const gender = document.getElementById('gender').value;
    const age = document.getElementById('age').value;
    const occupation = document.getElementById('occupation').value;
    const status = document.getElementById('status').value;
    const address_no = document.getElementById('address_no').value;
    const subdistrict = document.getElementById('subdistrict').value;
    const district = document.getElementById('district').value;
    const province = document.getElementById('province').value;
    const height = document.getElementById('height').value;
    const weight = document.getElementById('weight').value;

    if(!name || !lastname) {
        alert('กรุณากรอกชื่อและนามสกุลด้วยครับ');
        return;
    }

    const payload = {
        sheetName: "health", // แก้ไขใส่เครื่องหมายคำพูดครอบให้ถูกต้องแล้วครับ
        values: [title, name, lastname, gender, age, occupation, status, address_no, subdistrict, district, province, height, weight]
    };

    // ⚠️ อย่าลืมใส่ลิงก์ Web App URL ตัวเดิมของคุณมิวนิคตรงนี้แทนคำในเครื่องหมายคำพูดนะครับ
    const webAppUrl = "https://script.google.com/macros/s/AKfycbzyu_sH__jrKWTS9qnU2DJIun36ufJS-RiXAmC3zaYx8hIm_OiXQnXFX8oBYioXHUlI/exec"; 

    fetch(webAppUrl, {
        method: "POST",
        body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
        if(data.result === "success") {
            alert('บันทึกข้อมูลของคุณ ' + name + ' ลง Google Sheet สำเร็จแล้วครับ!');
            // เคลียร์ฟอร์ม
            document.getElementById('firstname').value = '';
            document.getElementById('lastname').value = '';
            document.getElementById('age').value = '';
            document.getElementById('occupation').value = '';
            document.getElementById('address_no').value = '';
            document.getElementById('subdistrict').value = '';
            document.getElementById('district').value = '';
            document.getElementById('province').value = '';
            document.getElementById('height').value = '';
            document.getElementById('weight').value = '';
        } else {
            alert('เกิดข้อผิดพลาดจาก Sheets: ' + data.error);
        }
    })
    .catch(err => {
        console.error(err);
        alert('ไม่สามารถเชื่อมต่อกับ Google Sheets ได้ ตรวจสอบอินเทอร์เน็ตหรือลิงก์ Web App ครับ');
    });
}
</script>
</body>
</html>
