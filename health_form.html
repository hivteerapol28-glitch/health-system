<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกแบบสำรวจข้อมูลสุขภาพ</title>
    <style>
        :root {
            --bg-color: #f7f4fc;
            --card-bg: #ffffff;
            --primary-pastel: #b39ddb;
            --primary-dark: #7e57c2;
            --text-main: #4a3b60;
            --text-sub: #8c7b9e;
            --border-color: #e1d7f2;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: var(--bg-color); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box; 
        }
        .container { 
            background-color: var(--card-bg); 
            padding: 35px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(126, 87, 194, 0.08); 
            border: 1px solid var(--border-color); 
            width: 100%; 
            max-width: 600px; 
            text-align: center; 
        }
        .icon-banner { font-size: 50px; margin-bottom: 10px; }
        h2 { margin: 0 0 5px 0; color: var(--text-main); font-size: 24px; }
        p.subtitle { margin: 0 0 25px 0; color: var(--text-sub); font-size: 14px; }
        
        /* จัดรูปแบบฟอร์มให้เป็นระเบียบ */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 15px;
            text-align: left;
        }
        .input-group { width: 100%; }
        .input-group.full { grid-column: span 2; }
        
        label { display: block; margin-bottom: 6px; color: var(--text-main); font-weight: 600; font-size: 13.5px; }
        input, select { 
            width: 100%; 
            padding: 11px 14px; 
            border: 1.5px solid var(--border-color); 
            border-radius: 10px; 
            box-sizing: border-box; 
            font-size: 14.5px; 
            background-color: #faf9fe; 
            color: var(--text-main); 
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            border-color: var(--primary-dark);
        }

        fieldset { 
            border: 1.5px solid var(--border-color); 
            border-radius: 12px; 
            padding: 15px; 
            margin-bottom: 15px; 
            text-align: left; 
            background-color: #fcfbfe;
        }
        legend { 
            color: var(--primary-dark); 
            font-weight: bold; 
            font-size: 14px; 
            padding: 0 10px; 
        }

        button { 
            width: 100%; 
            padding: 13px; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            margin-top: 10px; 
        }
        .btn-submit { background-color: #27ae60; }
        .btn-submit:hover { background-color: #219653; }
        .btn-outline { background-color: transparent; color: var(--text-sub); border: 1px solid var(--border-color); margin-top: 8px; }
        .btn-outline:hover { background-color: #f3eff9; color: var(--text-main); }
    </style>
</head>
<body>

<div class="container">
    <div class="icon-banner">📝</div>
    <h2>แบบสำรวจข้อมูลสุขภาพ</h2>
    <p class="subtitle">กรอกประวัติส่วนตัวและข้อมูลสุขภาพชุมชน</p>

    <!-- ช่องกรอกเลขบัตรประชาชน -->
    <div class="form-grid">
        <div class="input-group full">
            <label>เลขบัตรประชาชน (13 หลัก)</label>
            <input type="text" id="idCard" placeholder="กรอกเลขบัตรประชาชน 13 หลัก" maxlength="13">
        </div>

        <div class="input-group">
            <label>คำนำหน้า</label>
            <select id="title">
                <option value="นาย">นาย</option>
                <option value="นาง">นาง</option>
                <option value="นางสาว">นางสาว</option>
                <option value="ด.ช.">ด.ช.</option>
                <option value="ด.ญ.">ด.ญ.</option>
            </select>
        </div>
        <div class="input-group">
            <label>เพศ</label>
            <select id="gender">
                <option value="ชาย">ชาย</option>
                <option value="หญิง">หญิง</option>
            </select>
        </div>

        <div class="input-group">
            <label>ชื่อจริง</label>
            <input type="text" id="firstname" placeholder="ชื่อจริง">
        </div>
        <div class="input-group">
            <label>นามสกุล</label>
            <input type="text" id="lastname" placeholder="นามสกุล">
        </div>

        <div class="input-group">
            <label>อายุ (ปี)</label>
            <input type="number" id="age" placeholder="ระบุอายุ">
        </div>
        <div class="input-group">
            <label>สถานะ</label>
            <select id="status">
                <option value="โสด">โสด</option>
                <option value="สมรส">สมรส</option>
                <option value="หม้าย / หย่าร้าง">หม้าย / หย่าร้าง</option>
            </select>
        </div>

        <div class="input-group full">
            <label>อาชีพ</label>
            <input type="text" id="occupation" placeholder="ระบุอาชีพ">
        </div>
    </div>

    <!-- ข้อมูลที่อยู่ -->
    <fieldset>
        <legend>ข้อมูลที่อยู่ปัจจุบัน</legend>
        <div class="form-grid" style="margin-bottom: 0;">
            <div class="input-group">
                <label>บ้านเลขที่</label>
                <input type="text" id="address_no" placeholder="บ้านเลขที่">
            </div>
            <div class="input-group">
                <label>ตำบล</label>
                <input type="text" id="subdistrict" placeholder="ตำบล">
            </div>
            <div class="input-group">
                <label>อำเภอ</label>
                <input type="text" id="district" placeholder="อำเภอ">
            </div>
            <div class="input-group">
                <label>จังหวัด</label>
                <input type="text" id="province" placeholder="จังหวัด">
            </div>
        </div>
    </fieldset>

    <!-- ข้อมูลร่างกาย -->
    <div class="form-grid">
        <div class="input-group">
            <label>ส่วนสูง (ซม.)</label>
            <input type="number" id="height" placeholder="เช่น 170">
        </div>
        <div class="input-group">
            <label>น้ำหนัก (กก.)</label>
            <input type="number" id="weight" placeholder="เช่น 60">
        </div>
    </div>

    <button class="btn-submit" onclick="saveData()">บันทึกข้อมูลสุขภาพ</button>
    <button class="btn-outline" onclick="window.location.href='index.html';">&larr; กลับหน้าหลัก</button>
</div>

<script>
function saveData() {
    const idCard = document.getElementById('idCard').value.trim();

    // ตรวจสอบความยาวเลขบัตรประชาชน
    if (idCard.length !== 13) { 
        alert('กรุณากรอกเลขบัตรประชาชนให้ครบ 13 หลัก'); 
        document.getElementById('idCard').focus();
        return; 
    }

    // จัดรูปแบบชุดข้อมูลพร้อมระบุ sheetName ให้ตรงกับเงื่อนไขใน Apps Script
    const payload = {
        sheetName: "health",
        values: [
            idCard,
            document.getElementById('title').value,
            document.getElementById('firstname').value,
            document.getElementById('lastname').value,
            document.getElementById('gender').value,
            document.getElementById('age').value,
            document.getElementById('occupation').value,
            document.getElementById('status').value,
            document.getElementById('address_no').value,
            document.getElementById('subdistrict').value,
            document.getElementById('district').value,
            document.getElementById('province').value,
            document.getElementById('height').value,
            document.getElementById('weight').value
        ]
    };

    const webAppUrl = "https://script.google.com/macros/s/AKfycbwpEVWrlq6VmBgVuV4yfVVC1ZQ6qwHTAkjoaz2xzJRJ-dTRhqteAY422W9IbfvkHtFP/exec"; 

    const btnSubmit = document.querySelector('.btn-submit');
    btnSubmit.innerText = 'กำลังบันทึกข้อมูล...';
    btnSubmit.disabled = true;

    fetch(webAppUrl, {
        method: "POST",
        body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
        if(data.result === "success" || data.status === "success") {
            alert('✅ บันทึกข้อมูลสุขภาพสำเร็จ!');
            location.reload();
        } else {
            alert('❌ เกิดข้อผิดพลาด: ' + (data.message || data.error));
            btnSubmit.innerText = 'บันทึกข้อมูลสุขภาพ';
            btnSubmit.disabled = false;
        }
    })
    .catch(err => {
        console.error(err);
        alert('❌ ไม่สามารถเชื่อมต่อระบบได้ กรุณาตรวจสอบอินเทอร์เน็ต');
        btnSubmit.innerText = 'บันทึกข้อมูลสุขภาพ';
        btnSubmit.disabled = false;
    });
}
</script>
</body>
</html>
