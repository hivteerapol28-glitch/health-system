<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - อาสาสมัครสาธารณสุขประจำหมู่บ้าน (อสม.)</title>
    <style>
        :root {
            --bg-color: #f0f4f9;
            --card-bg: #ffffff;
            --primary-navy: #1a237e;
            --primary-blue: #283593;
            --accent-blue: #82b1ff;
            --text-main: #1c2541;
            --text-sub: #5c677d;
            --border-color: #d0d7de;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#d0d7de 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: var(--card-bg);
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(26, 35, 126, 0.12);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        
        .logo-box {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            padding: 5px;
            background: #ffffff;
            box-shadow: 0 4px 15px rgba(26, 35, 126, 0.15);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }

        h2 { margin: 0 0 6px 0; color: var(--primary-navy); font-size: 22px; font-weight: 700; }
        p.subtitle { margin: 0 0 25px 0; color: var(--text-sub); font-size: 14px; }
        
        .input-group { margin-bottom: 18px; text-align: left; }
        label { display: block; margin-bottom: 6px; color: var(--text-main); font-weight: 600; font-size: 14px; }
        input { 
            width: 100%; 
            padding: 12px 15px; 
            border: 1.5px solid var(--border-color); 
            border-radius: 10px; 
            box-sizing: border-box; 
            font-size: 15px; 
            background-color: #f8fafc; 
            color: var(--text-main);
            transition: all 0.2s;
        }
        input:focus { 
            outline: none; 
            border-color: var(--primary-blue); 
            background-color: #ffffff; 
            box-shadow: 0 0 8px rgba(40, 53, 147, 0.15);
        }
        
        button { 
            width: 100%; 
            padding: 14px; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            margin-top: 10px; 
            background-color: var(--primary-navy); 
            box-shadow: 0 4px 12px rgba(26, 35, 126, 0.25); 
        }
        button:hover { 
            background-color: var(--primary-blue); 
            transform: translateY(-1px);
        }
        
        .footer-text {
            margin-top: 20px;
            font-size: 12px;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-box">
        <img src="logo.jpg" alt="โลโก้ อสม." onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Village_Health_Volunteer_Logo.png/480px-Village_Health_Volunteer_Logo.png';">
    </div>

    <h2>ระบบบันทึกข้อมูลสุขภาพ</h2>
    <p class="subtitle">อาสาสมัครสาธารณสุขประจำหมู่บ้าน (อสม.)</p>

    <div class="input-group">
        <label>ชื่อผู้ใช้งาน / Username</label>
        <input type="text" id="username" placeholder="ระบุชื่อผู้ใช้งาน">
    </div>

    <div class="input-group">
        <label>เลขประจำตัวประชาชน (13 หลัก)</label>
        <input type="text" id="idCard" maxlength="13" placeholder="กรอกเลขบัตรประชาชน 13 หลัก" oninput="this.value = this.value.replace(/[^0-9]/g, '');">
    </div>

    <button onclick="handleLogin()">เข้าสู่ระบบ</button>

    <div class="footer-text">
        ระบบบันทึกและประเมินสถิติสุขภาพชุมชน
    </div>
</div>

<script>
// ฟังก์ชันตรวจสอบความถูกต้องของเลขประจำตัวประชาชนไทย (Thai ID Checksum)
function checkThaiID(id) {
    if (id.length !== 13) return false;
    let sum = 0;
    for (let i = 0; i < 12; i++) {
        sum += parseInt(id.charAt(i)) * (13 - i);
    }
    let checkDigit = (11 - (sum % 11)) % 10;
    return checkDigit === parseInt(id.charAt(12));
}

function handleLogin() {
    const user = document.getElementById('username').value.trim();
    const idCard = document.getElementById('idCard').value.trim();

    if (!user) {
        alert('กรุณากรอกชื่อผู้ใช้งานก่อนครับ');
        return;
    }

    if (idCard.length !== 13) {
        alert('กรุณากรอกเลขประจำตัวประชาชนให้ครบ 13 หลักครับ');
        return;
    }

    // ตรวจสอบโครงสร้างความถูกต้องของเลขบัตรประชาชน
    if (!checkThaiID(idCard)) {
        alert('เลขประจำตัวประชาชนไม่ถูกต้องตามรูปแบบ กรุณาตรวจสอบอีกครั้งครับ');
        return;
    }

    // บันทึกชื่อผู้ใช้ลงในความจำเบราว์เซอร์
    localStorage.setItem('currentUser', user);
    
    alert('เข้าสู่ระบบสำเร็จ! ยินดีต้อนรับ คุณ' + user);
    window.location.href = 'index.html';
}
</script>

</body>
</html>
